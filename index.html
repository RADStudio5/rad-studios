<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAD Video-editor</title>
<style>
:root{--bg:#f3f2ee;--pn:#fff;--tx:#1c1c1a;--mu:#7a7973;--ac:#e8542a;--bd:#dddbd4;--ac-tx:#fff;--c1:#4a7fd0;--c3:#2f9a6b;--ph:#1c1c1a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--pn:#171717;--tx:#f2f2f0;--mu:#8d8d88;--ac:#ff6a3d;--bd:#2a2a28;--ph:#fff}}
:root[data-theme="dark"]{--bg:#0b0b0b;--pn:#171717;--tx:#f2f2f0;--mu:#8d8d88;--ac:#ff6a3d;--bd:#2a2a28;--ph:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
header b{font-size:.95rem}
#ex{background:var(--ac);color:var(--ac-tx);border:0;border-radius:16px;padding:7px 13px;font:inherit;font-weight:700}.head-actions{display:flex;gap:5px;align-items:center}.headbtn{border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:14px;padding:7px 9px;font:inherit;font-size:.72rem}
#pvw{flex:1;min-height:100px;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
canvas{max-width:100%;max-height:100%;background:#000;touch-action:none}
#bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 14px;background:var(--pn)}
#tm{font-variant-numeric:tabular-nums;color:var(--mu);font-size:.8rem}#tm b{color:var(--tx)}
#ur{justify-self:end;display:flex}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--tx);font-size:1.15rem}
.ib:disabled{opacity:.3}
#pl{width:44px;height:44px;background:var(--tx);color:var(--bg)}
#tlw{position:relative;background:var(--pn);border-top:1px solid var(--bd)}
#cph{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ph);z-index:8;pointer-events:none}
#sc{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x}
#sc::-webkit-scrollbar{display:none}
#tl{position:relative;height:192px}
.ruler{position:absolute;top:0;left:0;right:0;height:20px}
.ruler span{position:absolute;top:3px;font-size:.62rem;color:var(--mu);padding-left:3px}
.it{position:absolute;border-radius:6px;color:#fff;font-size:.7rem;padding:3px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:2px solid transparent}
.clip{top:90px;height:56px;background-color:var(--c1);background-size:auto 100%;background-repeat:repeat-x;text-shadow:0 1px 3px #000;display:flex;align-items:flex-end}
.aud{top:152px;height:34px;background:var(--c3);display:flex;align-items:center;position:absolute}.aud .waveform{position:absolute;inset:1px;width:100%;height:100%;opacity:.62;pointer-events:none;z-index:0}.aud .audname{position:relative;z-index:1;text-shadow:0 1px 2px #145b3c}.clip.sel{touch-action:none;cursor:grab}.clip.dragging{opacity:.72;z-index:7}
.o{height:28px;display:flex;align-items:center}.o1{top:58px;background:#c9972b}.o2{top:26px;background:#b44f9b}
.sel{border-color:var(--ph);z-index:3}.sel.aud,.sel.o{touch-action:none}
.h{display:none;position:absolute;top:0;bottom:0;width:16px;background:var(--ph);opacity:.85;touch-action:none;z-index:2}
.sel .h{display:block}.h.l{left:0}.h.r{right:0}
.badge{position:absolute;top:110px;font-size:.7rem;background:var(--ac);color:var(--ac-tx);border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;z-index:4;pointer-events:none;margin-left:-10px}
.plus{position:absolute;top:98px;width:42px;height:42px;border-radius:8px;border:0;background:var(--tx);color:var(--bg);font-size:1.5rem;z-index:2}
#zm{position:absolute;right:6px;top:1px;z-index:9;display:flex;gap:4px}
#zm button{width:26px;height:20px;border:0;border-radius:6px;background:var(--bd);color:var(--tx);font-weight:700;padding:0}
#sheet{background:var(--pn);border-top:1px solid var(--bd);padding:8px 14px;display:none;max-height:34vh;overflow-y:auto}
#sheet.on{display:block}
.chips{display:flex;gap:8px;margin:5px 0;overflow-x:auto;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:16px;padding:6px 12px;font:inherit}
.chip.on{background:var(--ac);color:var(--ac-tx);border-color:var(--ac)}
.sw{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--bd)}.sw.on{border-color:var(--ac);outline:2px solid var(--ac)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.grid button{font-size:1.4rem;background:none;border:0;padding:4px}
label{display:block;font-size:.8rem;color:var(--mu);margin-top:5px}label b{color:var(--tx)}
input[type=range]{width:100%;accent-color:var(--ac)}
input[type=text]{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
#tb{display:flex;overflow-x:auto;background:var(--pn);border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
#tb button{flex:0 0 auto;min-width:62px;border:0;background:transparent;color:var(--tx);font:inherit;font-size:.68rem;padding:4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
#tb button i{font-style:normal;font-size:1.25rem}#tb button.on{color:var(--ac)}
#st{padding:2px 14px;font-size:.72rem;color:var(--mu);background:var(--pn);min-height:20px}
#res{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;padding:16px;overflow:auto}
#res>div{max-width:560px;margin:auto;background:var(--pn);border-radius:14px;padding:14px}
#res video{width:100%;border-radius:10px;background:#000}
.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;background:var(--ac);color:var(--ac-tx);margin:10px 8px 0 0}.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.hide{display:none}
.filepicker{position:fixed!important;left:-10000px!important;top:0!important;width:1px!important;height:1px!important;opacity:0!important;display:block!important;pointer-events:none!important}#dropnote{display:none;position:fixed;inset:10px;z-index:30;border:3px dashed var(--ac);border-radius:18px;background:rgba(0,0,0,.75);color:white;align-items:center;justify-content:center;text-align:center;font-size:1.2rem;font-weight:700;pointer-events:none}#dropnote.show{display:flex}@media(max-width:390px){.headbtn{font-size:.65rem;padding:6px}.head-actions{gap:3px}header{padding:7px 8px}}
</style>
</head>
<body>
<div id="app">
<header><b>RAD Studio</b><div class="head-actions"><button id="addmedia" class="headbtn">＋ Media</button><button id="saveproj" class="headbtn">Project opslaan</button><button id="openproj" class="headbtn">Openen</button><button id="ex">Exporteren</button></div></header>
<div id="pvw"><canvas id="cv" width="1280" height="720"></canvas></div>
<div id="bar"><div id="tm"></div><button class="ib" id="pl">▶</button><div id="ur"><button class="ib" id="un">↶</button><button class="ib" id="rd">↷</button></div></div>
<div id="st">Tik op “Clip” om video’s of foto’s toe te voegen.</div>
<div id="tlw"><div id="zm"><button id="zo">−</button><button id="zi">+</button></div><div id="cph"></div><div id="sc"><div id="tl"></div></div></div>
<div id="sheet"></div>
<div id="tb"></div>
</div>
<div id="dropnote">Laat je video’s, foto’s of audio hier los</div>
<input id="projectfile" type="file" accept="application/json,.radproj,.json" class="hide"><input id="f" type="file" accept="video/*,image/*" multiple class="filepicker"><input id="mf" type="file" accept="audio/*" class="filepicker"><input id="lf" type="file" accept="image/*" class="filepicker">
<div id="res"><div><b>Je video is klaar</b><video id="rv" controls playsinline style="margin-top:8px"></video><button class="btn" id="dl">Opslaan</button><button class="btn alt" id="cl2">Sluiten</button></div></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),x=cv.getContext('2d'),st=$('st'),sc=$('sc');
let W=1280,H=720,bg='#000',clips=[],aud=[],ovs=[],sel=null,ph=0,total=0,running=false,stopReq=false,drag=null,pd=null,actx,dest,spk,blob=null,blobExt='mp4',Z=60,tool=null,prog=false,undo=[],redo=[],clipDrag=null,suppressClipClick=false;
const R={'16:9 HD':[1280,720],'9:16 HD':[720,1280],'16:9 Full HD':[1920,1080],'9:16 Full HD':[1080,1920],'1:1':[1000,1000],'4:5':[864,1080],'4:5 Full HD':[1080,1350]};
const mul=(A,B)=>{const o=[];for(let r=0;r<3;r++)for(let c=0;c<4;c++)o.push(A[r*4]*B[c]+A[r*4+1]*B[4+c]+A[r*4+2]*B[8+c]+(c===3?A[r*4+3]:0));return o};
const mSat=s=>[.213+.787*s,.715-.715*s,.072-.072*s,0,.213-.213*s,.715+.285*s,.072-.072*s,0,.213-.213*s,.715-.715*s,.072+.928*s,0];
const mCon=k=>[k,0,0,128*(1-k),0,k,0,128*(1-k),0,0,k,128*(1-k)];
const mBri=b=>[b,0,0,0,0,b,0,0,0,0,b,0];
const mDiag=(r,g,b)=>[r,0,0,0,0,g,0,0,0,0,b,0];
const mSep=a=>{const S=[.393,.769,.189,.349,.686,.168,.272,.534,.131],o=[];for(let r=0;r<3;r++){for(let c=0;c<3;c++)o.push((r===c?1-a:0)+a*S[r*3+c]);o.push(0)}return o};
const chain=(...m)=>m.reduce((a,b)=>mul(b,a));
const F={none:['Geen',null],vivid:['Levendig',chain(mSat(1.5),mCon(1.1))],warm:['Warm',chain(mSep(.35),mSat(1.3))],cool:['Koel',chain(mDiag(.9,1,1.15),mSat(1.1))],bw:['Zwart-wit',mSat(0)],vint:['Vintage',chain(mSep(.6),mCon(.9))],drama:['Dramatisch',chain(mCon(1.4),mSat(.8))],fade:['Vaal',chain(mBri(1.1),mCon(.8),mSat(.8))],neg:['Negatief',[-1,0,0,255,0,-1,0,255,0,0,-1,255]]};
function cmat(c){let m=null;const add=a=>{m=m?mul(a,m):a};
  if(c.br!==100)add(mBri(c.br/100));if(c.ct!==100)add(mCon(c.ct/100));if(c.sa!==100)add(mSat(c.sa/100));
  const f=F[c.flt][1];if(f)add(f);return m}
const oc=document.createElement('canvas'),og=oc.getContext('2d',{willReadFrequently:true});
function pix(m){const d=og.getImageData(0,0,W,H),p=d.data,a=m[0],b=m[1],c=m[2],e=m[3],f=m[4],g=m[5],h=m[6],i=m[7],j=m[8],k=m[9],l=m[10],n=m[11];
  for(let q=0;q<p.length;q+=4){const R=p[q],G=p[q+1],B=p[q+2];p[q]=a*R+b*G+c*B+e;p[q+1]=f*R+g*G+h*B+i;p[q+2]=j*R+k*G+l*B+n}
  og.putImageData(d,0,0)}
const COL=['#ffffff','#000000','#ffd400','#ff3b30','#34c759','#0a84ff','#ff2d92'];
const TRL=[['none','Geen'],['fade','Vervagen'],['dipB','Via zwart'],['dipW','Flits wit'],['slideL','Schuif ←'],['slideR','Schuif →'],['slideU','Schuif ↑'],['slideD','Schuif ↓'],['zoomIn','Zoom in'],['zoomOut','Zoom uit'],['spin','Draaien'],['wipeL','Veeg →'],['wipeR','Veeg ←'],['wipeU','Veeg ↓'],['wipeD','Veeg ↑'],['door','Deuren'],['blinds','Luik'],['circle','Cirkel'],['diag','Diagonaal'],['random','Willekeurig']];
const msg=s=>st.textContent=s,fmt=t=>Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0');
const arr=k=>k==='v'?clips:k==='a'?aud:ovs,cur=()=>sel&&arr(sel.k)[sel.i],isel=(k,i)=>sel&&sel.k===k&&sel.i===i;
let scope='one';
const SC={v:[['one','Deze clip'],['all','Alle clips'],['video','Alle video’s'],['image','Alle foto’s']],a:[['one','Dit fragment'],['all','Alle audio']],o:[['one','Dit item'],['all','Alle van dit soort']]};
const scLabel=()=>(SC[sel.k].find(a=>a[0]===scope)||SC[sel.k][0])[1];
const targets=()=>{const s=cur();if(!s)return[];if(scope==='one')return[s];
  if(sel.k==='v')return scope==='all'?clips:clips.filter(c=>c.type===scope);
  if(sel.k==='a')return aud;return ovs.filter(o=>o.row===s.row)};
const each=f=>targets().forEach(f);
const cp=()=>({c:clips.map(c=>({...c,tr:{...c.tr}})),a:aud.map(a=>({...a})),o:ovs.map(o=>({...o})),W,H,bg});
function snap(){undo.push(cp());if(undo.length>40)undo.shift();redo=[];btns()}
function restore(f,t){if(!f.length||running)return;t.push(cp());const s=f.pop();clips=s.c;aud=s.a;ovs=s.o;bg=s.bg;setSize(s.W,s.H);sel=null;full()}
$('un').onclick=()=>restore(undo,redo);$('rd').onclick=()=>restore(redo,undo);
const btns=()=>{$('un').disabled=!undo.length;$('rd').disabled=!redo.length};
function setSize(w,h){W=w;H=h;cv.width=w;cv.height=h;cv.style.aspectRatio=w+'/'+h}

/* ---------- clips ---------- */
function mkVideo(url,c){const el=document.createElement('video');el.playsInline=true;el.preload='auto';el.src=url;
  el.onloadedmetadata=()=>{c.max=el.duration;if(!c.out)c.out=el.duration;full()};
  el.onloadeddata=()=>{if(!c.thumb){const t=document.createElement('canvas');t.width=96;t.height=54;const g=t.getContext('2d');
    const k=Math.max(96/el.videoWidth,54/el.videoHeight);g.drawImage(el,(96-el.videoWidth*k)/2,(54-el.videoHeight*k)/2,el.videoWidth*k,el.videoHeight*k);
    try{c.thumb=t.toDataURL('image/jpeg',.6)}catch(e){}renderTL()}if(!running)draw(ph)};
  el.onseeked=()=>{if(!running)draw(ph)};return el}
const newClip=(f,url)=>{const v=f.type.startsWith('video');
  const c={type:v?'video':'image',name:f.name,url,in:0,out:0,dur:3,max:v?1:60,speed:1,vol:100,rot:0,mir:false,fill:false,zoom:100,br:100,ct:100,sa:100,op:100,flt:'none',tr:{type:'fade',d:.5}};
  if(v)c.el=mkVideo(url,c);else{c.el=new Image();c.el.onload=()=>draw(ph);c.el.src=url;c.thumb=url}return c};
function cloneClip(s){const n={...s,tr:{...s.tr},node:null,g:null,on:false};if(s.type==='video')n.el=mkVideo(s.url,n);return n}
function layout(){
  clips.forEach((c,i)=>{const p=clips[i-1];c.d=c.type==='image'?c.dur:(c.out-c.in)/c.speed;
    c.T=(i&&c.tr.type!=='none')?Math.min(c.tr.d,p.d/2,c.d/2):0;c.s=i?p.s+p.d-c.T:0});
  const l=clips[clips.length-1];total=l?l.s+l.d:0;
}
const full=()=>{renderTL();toolbar();sheet();draw(ph);btns()};
const pick=(k,i)=>{if(!sel||sel.k!==k)scope='one';sel=isel(k,i)?null:{k,i};tool=null;full()};

/* ---------- timeline ---------- */
function renderTL(){
  layout();const tl=$('tl'),half=sc.clientWidth/2;
  const end=Math.max(total,...aud.map(a=>a.off+a.out-a.in),...ovs.map(o=>o.s+o.d));
  tl.style.marginLeft=half+'px';tl.style.width=(end*Z+half+90)+'px';tl.innerHTML='';
  const ru=document.createElement('div');ru.className='ruler';
  for(let s=0,step=Z>=40?1:5;s*Z<end*Z+200;s+=step){const e=document.createElement('span');e.style.left=s*Z+'px';e.textContent=s+'s';ru.appendChild(e)}
  tl.appendChild(ru);
  const add=(cls,l,w,txt)=>{const d=document.createElement('div');d.className='it '+cls;d.style.left=l+'px';d.style.width=Math.max(14,w)+'px';d.textContent=txt;tl.appendChild(d);return d};
  clips.forEach((c,i)=>{
    const d=add('clip'+(isel('v',i)?' sel':''),c.s*Z,c.d*Z-2,(c.speed!==1?c.speed+'× ':'')+c.d.toFixed(1)+'s');
    if(c.thumb)d.style.backgroundImage='url('+c.thumb+')';
    d.onclick=()=>{if(suppressClipClick){suppressClipClick=false;return}pick('v',i)};
    d.onpointerdown=e=>{if(!isel('v',i)||e.target.classList.contains('h'))return;e.preventDefault();e.stopPropagation();snap();suppressClipClick=true;clipDrag={clip:c,from:i,x:e.clientX,start:e.clientX,el:d,moved:false};d.classList.add('dragging');try{d.setPointerCapture(e.pointerId)}catch(_){} };
    hnd(d,c,'v');
    if(c.T>0){const b=document.createElement('div');b.className='badge';b.style.left=c.s*Z+'px';b.textContent='⇄';tl.appendChild(b)}
  });
  const pl=document.createElement('button');pl.className='plus';pl.textContent='+';pl.style.left=(total*Z+10)+'px';pl.onclick=()=>$('f').click();tl.appendChild(pl);
  aud.forEach((a,i)=>{
    const d=add('aud'+(isel('a',i)?' sel':''),a.off*Z,(a.out-a.in)*Z,'');
    const name=document.createElement('span');name.className='audname';name.textContent='♪ '+a.name+(a.L?' 🔁':'');d.appendChild(name);
    if(a.peaks&&a.peaks.length){const wave=document.createElement('canvas');wave.className='waveform';wave.width=Math.max(80,Math.min(1400,Math.round((a.out-a.in)*Z)));wave.height=64;const g=wave.getContext('2d');g.fillStyle='rgba(255,255,255,.78)';const peaks=a.peaks,step=wave.width/peaks.length;for(let q=0;q<peaks.length;q++){const h=Math.max(1,peaks[q]*26);g.fillRect(q*step,32-h,Math.max(1,step*.62),h*2)}d.insertBefore(wave,name)}
    d.onclick=()=>pick('a',i);mv(d,a,'off');hnd(d,a,'a');
  });
  ovs.forEach((o,i)=>{
    const d=add('o o'+o.row+(isel('o',i)?' sel':''),o.s*Z,o.d*Z,o.img?'▣ Overlay':o.row===2?o.text:'T '+o.text);
    d.onclick=()=>pick('o',i);mv(d,o,'s');hnd(d,o,'o');
  });
  syncScroll();tdisp();
}
function mv(d,c,key){d.onpointerdown=e=>{if(!d.classList.contains('sel'))return;const o=c[key];startDrag(e,dx=>{c[key]=Math.max(0,o+dx)})}}
function hnd(d,c,k){
  ['l','r'].forEach(sd=>{const h=document.createElement('div');h.className='h '+sd;
    h.onpointerdown=e=>{const c0={...c};startDrag(e,dx=>{
      if(k==='o'){if(sd==='r')c.d=Math.max(.3,c0.d+dx);else{const n=Math.min(c0.s+c0.d-.3,Math.max(0,c0.s+dx));c.d=c0.d-(n-c0.s);c.s=n}}
      else if(c.type==='image')c.dur=Math.max(.5,c0.dur+(sd==='r'?dx:-dx));
      else{const sp=k==='v'?c.speed:1;
        if(sd==='r')c.out=Math.min(c.max,Math.max(c0.in+.3,c0.out+dx*sp));
        else{c.in=Math.max(0,Math.min(c0.out-.3,c0.in+dx*sp));if(k==='a')c.off=c0.off+(c.in-c0.in)}}
    })};d.appendChild(h)});
}
function startDrag(e,fn){e.preventDefault();e.stopPropagation();if(running)return;snap();const x0=e.clientX;drag=ev=>{fn((ev.clientX-x0)/Z);renderTL()}}
addEventListener('pointermove',e=>{if(drag)drag(e);if(clipDrag){const dx=e.clientX-clipDrag.start;if(Math.abs(dx)>5)clipDrag.moved=true;clipDrag.el.style.transform='translateX('+dx+'px)'}});
addEventListener('pointerup',e=>{if(drag){drag=null;draw(ph)}if(clipDrag){const q=clipDrag;clipDrag=null;q.el.classList.remove('dragging');q.el.style.transform='';if(q.moved){const rect=sc.getBoundingClientRect(),dropTime=(e.clientX-rect.left+sc.scrollLeft)/Z;const others=clips.filter(c=>c!==q.clip);let target=others.findIndex(c=>dropTime<(c.s+c.d/2));if(target<0)target=others.length;clips.splice(clips.indexOf(q.clip),1);clips.splice(target,0,q.clip);sel={k:'v',i:target};full()}else draw(ph);setTimeout(()=>suppressClipClick=false,0)}});
$('tl').addEventListener('click',e=>{if(e.target.id==='tl'||e.target.classList.contains('ruler')){sel=null;tool=null;full()}});
function syncScroll(){if(Math.abs(sc.scrollLeft-ph*Z)>1){prog=true;sc.scrollLeft=ph*Z;requestAnimationFrame(()=>prog=false)}}
sc.addEventListener('scroll',()=>{if(running||prog)return;ph=Math.max(0,Math.min(total,sc.scrollLeft/Z));seek(ph);tdisp()});
const tdisp=()=>{$('tm').innerHTML='<b>'+fmt(ph)+'</b> / '+fmt(total)};
$('zi').onclick=()=>{Z=Math.min(200,Z*1.3);renderTL()};$('zo').onclick=()=>{Z=Math.max(12,Z/1.3);renderTL()};

/* ---------- toolbar & sheets ---------- */
function toolbar(){

  const del=()=>it('🗑','Verwijder',()=>{snap();arr(sel.k).splice(sel.i,1);sel=null;tool=null;full()});
  if(s)it('⊞',scLabel(),()=>{const o=SC[sel.k],j=o.findIndex(a=>a[0]===scope);scope=o[(j+1)%o.length][0];toolbar();sheet()},scope!=='one');
  if(!s){it('🎞','Clip',()=>$('f').click());it('♪','Audio',()=>$('mf').click());T('🎼','Bibliotheek','lib');it('T','Tekst',addText);T('😀','Sticker','stk');it('▣','Overlay',()=>$('lf').click());T('⬚','Formaat','fmt');if(clips.length)T('⊞','Alle clips','allc')}
  else if(sel.k==='v'){
    it('✂','Knippen',cut);if(s.type==='video')T('⏩','Snelheid','spd');T('🔊','Volume','vol');if(sel.i>0)T('⇄','Overgang','tr');
    T('🎨','Filters','flt');T('☀','Aanpassen','adj');
    it('⟳','Draaien',()=>{snap();const r=(s.rot+90)%360;each(c=>c.rot=r);full()});it('⇋','Spiegelen',()=>{snap();const m=!s.mir;each(c=>c.mir=m);full()});
    it('⛶',s.fill?'Passend':'Vullen',()=>{snap();const f=!s.fill;each(c=>c.fill=f);full()});it('⧉','Dupliceer',dup);
    it('◀','Eerder',()=>move(-1));it('▶','Later',()=>move(1));del();
  }else if(sel.k==='a'){it('✂','Knippen',cut);if(s.buf)it('🔁','Loop tot einde',()=>{snap();s.out=s.in+Math.max(.3,total-s.off);full()});T('🔊','Volume','vol');T('📉','Fade','fade');it('⧉','Dupliceer',dup);del()}
  else{if(!s.img&&!s.emoji){T('Aa','Tekst','txt');T('🎨','Kleur','col')}T('⇔','Grootte','siz');it('✂','Knippen',cut);it('⧉','Dupliceer',dup);del()}
}

/* ---------- editing actions ---------- */
function move(d){if(running||!sel)return;const j=sel.i+d;if(j<0||j>=clips.length)return;snap();[clips[sel.i],clips[j]]=[clips[j],clips[sel.i]];sel.i=j;full()}
function cut(){
  if(running||!sel)return;const s=cur(),k=sel.k;
  const bad=()=>msg('Scroll de tijdlijn zodat de witte lijn midden in het onderdeel staat.');
  if(k==='v'){const l=ph-s.s;if(l<=.3||l>=s.d-.3)return bad();snap();const n=cloneClip(s);n.tr={type:'none',d:.5};
    if(s.type==='video'){n.in=s.in+l*s.speed;n.out=s.out;s.out=n.in}else{n.dur=s.d-l;s.dur=l}clips.splice(sel.i+1,0,n)}
  else if(k==='a'){const l=ph-s.off;if(l<=.3||l>=s.out-s.in-.3)return bad();snap();
    const n={...s,el:s.buf?null:new Audio(s.url),src:null,node:null,g:null,on:false,in:s.in+l,off:ph};s.out=s.in+l;aud.push(n)}
  else{const l=ph-s.s;if(l<=.3||l>=s.d-.3)return bad();snap();ovs.splice(sel.i+1,0,{...s,s:ph,d:s.s+s.d-ph});s.d=l}
  full();
}
function dup(){
  if(running||!sel)return;snap();const s=cur(),k=sel.k;
  if(k==='v')clips.splice(sel.i+1,0,cloneClip(s));
  else if(k==='a')aud.push({...s,el:s.buf?null:new Audio(s.url),src:null,node:null,g:null,on:false,off:s.off+s.out-s.in});
  else ovs.push({...s,s:s.s+.5,x:Math.min(1,s.x+.05),y:Math.min(1,s.y+.05)});
  full();
}
$('addmedia').onclick=()=>{const input=$('f');input.value='';try{input.click()}catch(err){msg('Kan de filmrol niet openen. Open RAD Studio in Safari en probeer opnieuw.')}};
$('f').onchange=e=>{const files=[...e.target.files||[]];if(!files.length)return;snap();files.forEach(f=>{if(f.type.startsWith('video/')||f.type.startsWith('image/'))clips.push(newClip(f,URL.createObjectURL(f)))});e.target.value='';full();msg(clips.length?'Clips toegevoegd.':'Geen ondersteunde video of foto geselecteerd.')};
async function makePeaks(a){try{let buffer=a.buf;if(!buffer&&a.url){const response=await fetch(a.url);const bytes=await response.arrayBuffer();buffer=await ctx().decodeAudioData(bytes.slice(0))}if(!buffer)return;const data=buffer.getChannelData(0),count=240,block=Math.max(1,Math.floor(data.length/count)),peaks=[];for(let i=0;i<count;i++){let peak=0;const end=Math.min(data.length,(i+1)*block);for(let j=i*block;j<end;j++)peak=Math.max(peak,Math.abs(data[j]));peaks.push(peak)}a.peaks=peaks;renderTL()}catch(err){console.warn('Waveform kon niet worden berekend:',err)}}
$('mf').onchange=e=>{const f=e.target.files[0];if(!f)return;snap();const url=URL.createObjectURL(f);
  const a={name:f.name,url,el:new Audio(url),in:0,out:0,off:Math.min(ph,total),max:1,vol:100,fade:0,on:false};
  a.el.preload='auto';a.el.onloadedmetadata=()=>{a.out=a.max=a.el.duration;renderTL();makePeaks(a)};aud.push(a);e.target.value='';full()};

/* ---------- drawing ---------- */
const cr=(a,b,c,d)=>{x.beginPath();x.rect(a,b,c,d);x.clip()};
const sc2=k=>{x.translate(W/2,H/2);x.scale(k,k);x.translate(-W/2,-H/2)};
const TR={fade:p=>{x.globalAlpha=p},
dipB:p=>{x.globalAlpha=p<.5?p*2:(1-p)*2;x.fillStyle='#000';x.fillRect(0,0,W,H);x.globalAlpha=p>.5?(p-.5)*2:0},
dipW:p=>{x.globalAlpha=p<.5?p*2:(1-p)*2;x.fillStyle='#fff';x.fillRect(0,0,W,H);x.globalAlpha=p>.5?(p-.5)*2:0},
slideL:p=>x.translate((1-p)*W,0),slideR:p=>x.translate(-(1-p)*W,0),slideU:p=>x.translate(0,(1-p)*H),slideD:p=>x.translate(0,-(1-p)*H),
zoomIn:p=>{x.globalAlpha=p;sc2(.5+.5*p)},zoomOut:p=>{x.globalAlpha=p;sc2(1.6-.6*p)},
spin:p=>{x.globalAlpha=p;x.translate(W/2,H/2);x.rotate((1-p)*-1.5);x.scale(.4+.6*p,.4+.6*p);x.translate(-W/2,-H/2)},
wipeL:p=>cr(0,0,W*p,H),wipeR:p=>cr(W*(1-p),0,W*p,H),wipeU:p=>cr(0,0,W,H*p),wipeD:p=>cr(0,H*(1-p),W,H*p),
door:p=>cr(W/2*(1-p),0,W*p,H),blinds:p=>cr(0,H/2*(1-p),W,H*p),
circle:p=>{x.beginPath();x.arc(W/2,H/2,Math.hypot(W,H)/2*p,0,7);x.clip()},
diag:p=>{x.beginPath();x.moveTo(0,0);x.lineTo(2*W*p,0);x.lineTo(0,2*H*p);x.closePath();x.clip()}};
const TK=Object.keys(TR);
const fnt=o=>(o.emoji?400:700)+' '+Math.round(o.sz*W/100)+'px system-ui,sans-serif';
function box(o){let w,h;
  if(o.img){w=o.w*W/100;h=o.img.naturalWidth?w*o.img.naturalHeight/o.img.naturalWidth:w}
  else{x.font=fnt(o);w=x.measureText(o.text).width;h=o.sz*W/100*1.25}
  return{l:o.x*W-w/2,t:o.y*H-h/2,w,h}}
function draw(t){
  x.globalAlpha=1;x.fillStyle=bg;x.fillRect(0,0,W,H);
  clips.forEach((c,i)=>{
    if(t<c.s||t>=c.s+c.d)return;
    const p=(i>0&&c.T>0&&t-c.s<c.T)?(t-c.s)/c.T:1,m=c.tr.type==='random'?TK[(i*5+3)%TK.length]:c.tr.type;
    x.save();if(p<1&&TR[m])TR[m](p);x.globalAlpha*=c.op/100;
    const el=c.el,w=c.type==='image'?el.naturalWidth:el.videoWidth,h=c.type==='image'?el.naturalHeight:el.videoHeight;
    if(w){const sw=c.rot%180,rw=sw?h:w,rh=sw?w:h,k=(c.fill?Math.max:Math.min)(W/rw,H/rh)*c.zoom/100,M=cmat(c),g=M?og:x;
      if(M){if(oc.width!==W||oc.height!==H){oc.width=W;oc.height=H}og.setTransform(1,0,0,1,0,0);og.clearRect(0,0,W,H)}
      g.save();g.translate(W/2,H/2);g.rotate(c.rot*Math.PI/180);g.scale(c.mir?-k:k,k);g.drawImage(el,-w/2,-h/2,w,h);g.restore();
      if(M){pix(M);x.drawImage(oc,0,0)}}
    x.restore();
  });
  ovs.forEach(o=>{
    if(t<o.s||t>=o.s+o.d)return;const b=box(o);
    if(o.img){if(o.img.naturalWidth)x.drawImage(o.img,b.l,b.t,b.w,b.h)}
    else{x.font=fnt(o);x.textAlign='center';x.textBaseline='middle';
      if(!o.emoji){x.lineJoin='round';x.lineWidth=o.sz*W/100*.14;x.strokeStyle='rgba(0,0,0,.75)';x.strokeText(o.text,o.x*W,o.y*H)}
      x.fillStyle=o.color;x.fillText(o.text,o.x*W,o.y*H)}
    if(!running&&sel&&sel.k==='o'&&ovs[sel.i]===o){x.strokeStyle='#fff';x.lineWidth=3;x.setLineDash([10,7]);x.strokeRect(b.l-6,b.t-6,b.w+12,b.h+12);x.setLineDash([])}
  });
}
function seek(t){ph=t;clips.forEach(c=>{if(c.type==='video'&&t>=c.s&&t<c.s+c.d)c.el.currentTime=Math.min(c.out,c.in+(t-c.s)*c.speed)});draw(t)}
const cxy=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
cv.addEventListener('pointerdown',e=>{
  if(running)return;const[px,py]=cxy(e);
  for(let i=ovs.length-1;i>=0;i--){const o=ovs[i];if(ph<o.s||ph>=o.s+o.d)continue;const b=box(o);
    if(px>=b.l&&px<=b.l+b.w&&py>=b.t&&py<=b.t+b.h){snap();sel={k:'o',i};tool=null;pd={o,px,py,ox:o.x,oy:o.y};cv.setPointerCapture(e.pointerId);full();return}}
});
cv.addEventListener('pointermove',e=>{if(!pd)return;const[px,py]=cxy(e);pd.o.x=pd.ox+(px-pd.px)/W;pd.o.y=pd.oy+(py-pd.py)/H;draw(ph)});

let dragDepth=0;addEventListener('dragenter',e=>{if(e.dataTransfer?.types?.includes('Files')){$('dropnote').classList.add('show');dragDepth++}});addEventListener('dragleave',e=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('dropnote').classList.remove('show')});addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault()});addEventListener('drop',e=>{if(!e.dataTransfer?.files?.length)return;e.preventDefault();dragDepth=0;$('dropnote').classList.remove('show');const fs=[...e.dataTransfer.files];const vids=fs.filter(f=>f.type.startsWith('video/')||f.type.startsWith('image/')),sounds=fs.filter(f=>f.type.startsWith('audio/'));if(vids.length){snap();vids.forEach(f=>clips.push(newClip(f,URL.createObjectURL(f))))}sounds.forEach(f=>{snap();const url=URL.createObjectURL(f),a={name:f.name,url,el:new Audio(url),in:0,out:0,off:Math.min(ph,total),max:1,vol:100,fade:0,on:false};a.el.onloadedmetadata=()=>{a.out=a.max=a.el.duration;renderTL();makePeaks(a)};aud.push(a)});full();msg('Bestanden toegevoegd.')});
addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.code==='Space'){e.preventDefault();running?stopReq=true:play(false)}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();restore(undo,redo)}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();restore(redo,undo)}else if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();snap();arr(sel.k).splice(sel.i,1);sel=null;full()}else if(e.key==='ArrowLeft')seek(Math.max(0,ph-.1));else if(e.key==='ArrowRight')seek(Math.min(total,ph+.1))});

full();
</script>
</body>
</html>
